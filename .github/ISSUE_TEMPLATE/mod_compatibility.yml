name: Mod compatibility
description: AVCME causes a problem together with another mod (crash, changed behaviour, lag).
labels: ["compatibility", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        AVCME does not hook into other mods. Compatibility is only claimed for tested combinations, see [Supported Versions](https://github.com/CptGummiball/AVCME/wiki/Supported-Versions). Reports about untested combinations are very welcome.

  - type: input
    id: othermod
    attributes:
      label: Other mod(s) and version(s)
      placeholder: "Lithium mc1.21.1-0.15.4-fabric, C2ME 0.4.0-alpha.0.30+1.21.1"
    validations:
      required: true

  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "1.21.1"
        - "other (write it below)"
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: AVCME jar, Fabric Loader and Fabric API version
      placeholder: "avcme-0.1.0+mc1.21.1-fabric.jar, Fabric Loader 0.20.1, Fabric API 0.116.18+1.21.1"
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: What happens?
      options:
        - Crash / does not start
        - Gameplay changed only with both mods installed
        - Lag / worse tick times only with both mods installed
        - World damage / saving problem
        - Something else
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details and steps to reproduce
      description: Does it also happen without AVCME? Without the other mod? Output of `/avcme compatibility` helps.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`logs/latest.log` and crash reports (drag and drop, or a paste link)."
      placeholder: Drop files here or paste a link.
